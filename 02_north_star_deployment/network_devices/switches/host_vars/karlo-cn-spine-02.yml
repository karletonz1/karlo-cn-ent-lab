---
#Spanning Tree Configuration
spanning_tree:
  mode: mst
  priority: "4096"

#Physical Interfaces
spine_interfaces:
- name: "Ethernet3"
  peer: "karlo-cn-spine-01"
  channel: "70"
- name: "Ethernet4"
  peer: "karlo-cn-spine-01"
  channel: "70"
- name: "Ethernet6"
  peer: "karlo-cn-leaf-01"
  channel: "10"
- name: "Ethernet5"
  peer: "karlo-cn-leaf-02"
  channel: "20"

#OSPF Interfaces
ospf_interfaces:
- name: "Ethernet1"
  description: "OSPF Interface to karlo-cn-rtr-02"
  area: "0"
  ip_address: "10.0.71.10/30"
  network: "point-to-point"
- name: "Ethernet2"
  description: "OSPF Interface to karlo-cn-rtr-01"
  area: "0"
  ip_address: "10.0.71.6/30"
  network: "point-to-point"

#OSPF on Spine SVIs
ospf_svi_vlans:
- vlan: "10"
- vlan: "11"
- vlan: "20"
- vlan: "21"
- vlan: "30"
- vlan: "40"
- vlan: "50"
- vlan: "60"
- vlan: "70"

#Global OSPF
ospf_area:
  area: "0"

ospf_router_id:
  router_id: "22.22.22.22"

#mlag Configuration
mlag:
  ip: "10.0.70.2/30"
  peer_ip: "10.0.70.1"

# Global VARP MAC Address
varp_mac_address: "00:1c:73:00:00:01"

mlag_svi_interfaces:
# MLAG Peer Link SVI
- mlag_vlan: "70"
  description: "SPINE MLAG PEER"
  ip_address: "10.0.70.2/30"
  autostate: false
  
# VARP Gateway SVIs
svi_interfaces:
- vlan: "10"
  description: "INFRA-MGMT"
  ip_address: "10.0.10.2/24"
  varp_ip: "10.0.10.254"
- vlan: "11"
  description: "SRV-MGMT"
  ip_address: "10.0.11.2/24"
  varp_ip: "10.0.11.254"
- vlan: "20"
  description: "WIN-CLIENTS"
  ip_address: "10.0.20.2/24"
  varp_ip: "10.0.20.254"
- vlan: "21"
  description: "LIN-CLIENTS"
  ip_address: "10.0.21.2/24"
  varp_ip: "10.0.21.254"
- vlan: "30"
  description: "SEC-APPS"
  ip_address: "10.0.30.2/24"
  varp_ip: "10.0.30.254"
- vlan: "40"
  description: "DMZ"
  ip_address: "10.0.40.2/24"
  varp_ip: "10.0.40.254"
- vlan: "50"
  description: "PRD-SVRS"
  ip_address: "10.0.50.2/24"
  varp_ip: "10.0.50.254"
- vlan: "60"
  description: "BACKUPS"
  ip_address: "10.0.60.2/24"
  varp_ip: "10.0.60.254"